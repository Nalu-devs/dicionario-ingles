<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dictionary - English Dictionary</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">English<span>Dictionary</span></div>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="dictionary.html">Dictionary</a>
        <a href="add.html">Add Word</a>
    </nav>

    <div id="loginSection" class="login-container">
        <h3>Login</h3>
        <input type="text" id="username" placeholder="Username" class="login-input">
        <input type="password" id="password" placeholder="Password" class="login-input">
        <button id="loginBtn" class="btn">Login</button>
    </div>

    <div id="userInfo" class="user-info" style="display: none;">
        <span>Welcome, <span class="username"></span>!</span>
        <button id="logoutBtn" class="btn clear-all-btn">Logout</button>
    </div>

    <main>
        <h2>Dictionary</h2>
        <div class="import-export">
            <button id="exportBtn" class="btn">Export Words</button>
            <label for="importFile" class="btn">Import Words</label>
            <input type="file" id="importFile" accept=".json" style="display: none;">
            <button id="clearAllBtn" class="clear-all-btn">Clear All User Words</button>
        </div>
        <div id="entries">
        </div>
    </main>

    <footer>
        <p>&copy; 2026 English Dictionary. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
