<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Dictionary</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">English<span>Dictionary</span></div>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="dictionary.html">Dictionary</a>
        <a href="add.html">Add Word</a>
    </nav>

    <div id="loginSection" class="login-container">
        <h3>Login</h3>
        <input type="text" id="username" placeholder="Username" class="login-input">
        <input type="password" id="password" placeholder="Password" class="login-input">
        <button id="loginBtn" class="btn">Login</button>
    </div>

    <div id="userInfo" class="user-info" style="display: none;">
        <span>Welcome, <span class="username"></span>!</span>
        <button id="logoutBtn" class="btn clear-all-btn">Logout</button>
    </div>

    <div class="search-container">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Enter a word...">
            <button id="searchBtn">Search</button>
            <div id="autocomplete" class="autocomplete"></div>
        </div>
        <div class="filters">
            <select id="posFilter">
                <option value="all">All Parts of Speech</option>
                <option value="noun">Noun</option>
                <option value="verb">Verb</option>
                <option value="adjective">Adjective</option>
                <option value="adverb">Adverb</option>
                <option value="exclamation">Exclamation</option>
            </select>
            <select id="viewFilter">
                <option value="all">All Words</option>
                <option value="favorites">Favorites</option>
                <option value="recent">Recent Searches</option>
            </select>
            <select id="sortFilter">
                <option value="alphabetical">A-Z</option>
                <option value="reverse">Z-A</option>
                <option value="recent">User Added First</option>
            </select>
        </div>
        <div class="action-buttons">
            <button id="randomWordBtn" class="btn">Random Word</button>
            <button id="quizBtn" class="btn">Start Quiz</button>
            <button id="printBtn" class="btn">Print Words</button>
            <button id="flashcardBtn" class="btn">Flashcards</button>
        </div>
        <div id="quizProgress"></div>
        <div id="achievements"></div>
        <div class="recent-searches" id="recentSearches"></div>
    </div>

    <div class="word-of-day" id="wordOfDay"></div>
    
    <div class="stats" id="stats"></div>
    
    <button id="themeToggle" class="btn" style="position: fixed; top: 10px; right: 10px;">🌙</button>
    
    <main id="entries">
    </main>

    <footer>
        <p>&copy; 2026 English Dictionary. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
